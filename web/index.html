<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Installed on iOS: the page runs under the status bar, and #root's
         safe-area padding keeps it clear (styles.css). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dakort" />
    <meta name="theme-color" content="#fdfcfa" />
    <title>Dakort</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // The keys were "made.*" before the project was renamed (2026-11-09):
      // carry a device's tabs, drafts and theme over once. Remove after a
      // release or two.
      for (const k of Object.keys(localStorage)) {
        if (!k.startsWith('made.')) continue
        const n = 'dakort.' + k.slice(5)
        if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k))
        localStorage.removeItem(k)
      }
      // Light or dark before the first paint (see src/theme.ts).
      document.documentElement.dataset.theme = localStorage.getItem('dakort.theme') === 'dark' ? 'dark' : 'light'
      if (document.documentElement.dataset.theme === 'dark') document.querySelector('meta[name=theme-color]').content = '#1f1e1c'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
