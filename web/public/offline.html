<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dakort</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; display: grid; place-items: center; min-height: 100dvh; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; background: #fdfcfa; color: #2b2a27; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #1f1e1c; color: #e6e3dd; } p { color: #9a958c; } }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 16px; color: #75716a; font-size: 15px; }
    button { font: inherit; padding: 8px 18px; border: 0; border-radius: 6px; background: #3b6ea8; color: #fff; }
  </style>
  <main>
    <h1>Dakort can't be reached</h1>
    <p>The computer it runs on is asleep, off the network, or Tailscale is off on one side.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</html>
